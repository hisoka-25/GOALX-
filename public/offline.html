<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >
  <meta
    name="theme-color"
    content="#080c12"
  >

  <title>
    GOALX — Hors connexion
  </title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px;

      display: grid;
      place-items: center;

      background: #070a0f;
      color: #f5f7fa;

      font-family:
        Arial,
        sans-serif;

      text-align: center;
    }

    .card {
      max-width: 460px;
      border: 1px solid #263140;
      padding: 42px 26px;
      background: #0d141d;
    }

    .mark {
      color: #d9ff38;
      font-size: 42px;
      font-weight: 900;
    }

    h1 {
      margin: 20px 0 10px;
      font-size: 28px;
    }

    p {
      color: #8995a3;
      line-height: 1.6;
    }

    button {
      margin-top: 15px;
      border: 0;
      padding: 14px 22px;

      background: #d9ff38;
      color: #070a0f;

      font-weight: 900;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="mark">
      /// GOALX
    </div>

    <h1>
      CONNEXION INDISPONIBLE
    </h1>

    <p>
      GOALX a besoin d’Internet
      pour protéger les matchs,
      les profils et les crédits.
      Aucune donnée privée n’est
      conservée hors ligne.
    </p>

    <button
      onclick="location.reload()"
    >
      RÉESSAYER
    </button>
  </main>
</body>
</html>
